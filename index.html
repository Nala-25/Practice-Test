<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BuCor Learning Portal</title>

  <style>
    :root {
      /* =====================================================
         COLOR PALETTE
         ===================================================== */

      --bg-color: #561C24;
      --card-bg: #E8D8C4;
      --card-text: #561C24;

      --accent: #6D2932;
      --accent-dark: #561C24;

      --success: #2F6B3C;
      --error: #9B2C2C;

      --border: #C7B7A3;

      --light-bg: #F3E9DD;
      --white: #FFFFFF;
    }


    /* =====================================================
       GLOBAL
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    body {
      background-color: var(--bg-color);

      color: var(--white);

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px 15px;
    }


    /* =====================================================
       MAIN CONTAINER
       ===================================================== */

    .app-container {
      width: 100%;
      max-width: 420px;

      display: flex;
      flex-direction: column;

      gap: 16px;
    }


    /* =====================================================
       LOADER
       ===================================================== */

    .loader {
      text-align: center;

      padding: 25px;

      font-size: 1rem;

      color: var(--card-bg);
    }


    .loader::after {
      content: "";

      display: block;

      width: 28px;
      height: 28px;

      margin: 14px auto 0;

      border: 3px solid var(--border);
      border-top-color: var(--card-bg);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }


    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       MODULE MENU
       ===================================================== */

    .module-menu {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }


    .module-card {
      background-color: var(--card-bg);

      color: var(--card-text);

      padding: 18px 22px;

      border-radius: 18px;

      font-size: 1.05rem;

      font-weight: 600;

      text-align: center;

      cursor: pointer;

      border: 2px solid transparent;

      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.15s ease,
        background-color 0.2s ease,
        border-color 0.2s ease;

      user-select: none;
    }


    .module-card:hover {
      transform: translateY(-2px);

      background-color: var(--light-bg);

      border-color: var(--accent);
    }


    .module-card:active {
      transform: scale(0.98);
    }


    /* Disabled Modules */

    .module-card.disabled {
      opacity: 0.45;

      cursor: not-allowed;

      transform: none;
    }


    .module-card.disabled:hover {
      transform: none;

      background-color: var(--card-bg);

      border-color: transparent;
    }


    /* =====================================================
       QUIZ CARD
       ===================================================== */

    .quiz-card {
      background-color: var(--card-bg);

      color: var(--card-text);

      border-radius: 20px;

      padding: 24px 20px;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.30);

      display: none;

      flex-direction: column;

      gap: 16px;
    }


    /* =====================================================
       QUIZ HEADER
       ===================================================== */

    .quiz-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      font-weight: bold;

      color: var(--accent-dark);

      font-size: 0.9rem;

      border-bottom:
        1px solid var(--border);

      padding-bottom: 10px;

      gap: 10px;
    }


    .back-btn {
      background: none;

      border: none;

      color: var(--accent);

      cursor: pointer;

      font-weight: 700;

      font-size: 0.9rem;

      padding: 5px 0;
    }


    .back-btn:hover {
      color: var(--accent-dark);

      text-decoration: underline;
    }


    /* =====================================================
       PROGRESS BAR
       ===================================================== */

    .progress-bar-wrap {
      width: 100%;

      height: 7px;

      background: var(--border);

      border-radius: 10px;

      overflow: hidden;
    }


    .progress-bar {
      height: 100%;

      width: 0%;

      background: var(--accent);

      transition:
        width 0.3s ease;
    }


    /* =====================================================
       QUESTION
       ===================================================== */

    .question-text {
      font-size: 1.05rem;

      font-weight: 650;

      line-height: 1.5;

      color: var(--card-text);
    }


    /* =====================================================
       OPTIONS
       ===================================================== */

    .options-list {
      display: flex;

      flex-direction: column;

      gap: 10px;
    }


    .option-btn {
      background-color: var(--white);

      border:
        2px solid var(--border);

      border-radius: 12px;

      padding: 13px 14px;

      text-align: left;

      font-size: 0.95rem;

      line-height: 1.4;

      color: var(--card-text);

      cursor: pointer;

      transition:
        all 0.2s ease;

      width: 100%;
    }


    .option-btn:not(:disabled):hover {
      border-color: var(--accent);

      background-color: var(--light-bg);

      transform: translateY(-1px);
    }


    .option-btn:disabled {
      cursor: default;
    }


    /* Correct Answer */

    .option-btn.correct {
      background-color: #DCEBDD !important;

      border-color:
        var(--success) !important;

      color:
        var(--success);

      font-weight: 700;
    }


    /* Incorrect Answer */

    .option-btn.incorrect {
      background-color: #F3DADA !important;

      border-color:
        var(--error) !important;

      color:
        var(--error);

      font-weight: 700;
    }


    /* =====================================================
       SHORT ANSWER
       ===================================================== */

    .short-input-group {
      display: flex;

      flex-direction: column;

      gap: 10px;
    }


    .short-input {
      padding: 13px;

      border:
        2px solid var(--border);

      border-radius: 10px;

      font-size: 1rem;

      width: 100%;

      outline: none;

      color: var(--card-text);

      background-color: var(--white);
    }


    .short-input:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 2px rgba(109, 41, 50, 0.12);
    }


    /* =====================================================
       ACTION BUTTON
       ===================================================== */

    .action-btn {
      background-color: var(--accent);

      color: var(--white);

      border: none;

      padding: 13px;

      border-radius: 10px;

      font-size: 1rem;

      font-weight: 700;

      cursor: pointer;

      transition:
        background-color 0.2s ease,
        transform 0.1s ease;
    }


    .action-btn:hover {
      background-color: var(--accent-dark);
    }


    .action-btn:active {
      transform: scale(0.98);
    }


    /* =====================================================
       NEXT BUTTON
       ===================================================== */

    .next-btn {
      display: none;

      width: 100%;

      margin-top: 5px;
    }


    /* =====================================================
       FEEDBACK
       ===================================================== */

    .feedback-box {
      display: none;

      padding: 13px 14px;

      border-radius: 10px;

      font-size: 0.9rem;

      line-height: 1.5;
    }


    .feedback-box.correct {
      background-color: #DCEBDD;

      border:
        1px solid #8DB394;

      color: #24552F;
    }


    .feedback-box.incorrect {
      background-color: #F3DADA;

      border:
        1px solid #D49A9A;

      color: #7A2020;
    }


    /* =====================================================
       RESULTS
       ===================================================== */

    .results-box {
      display: none;

      text-align: center;

      flex-direction: column;

      gap: 15px;

      color: var(--card-text);
    }


    .results-box h2 {
      color: var(--accent-dark);

      font-size: 1.4rem;
    }


    .results-score {
      font-size: 2.2rem;

      font-weight: bold;

      color: var(--accent);
    }


    .results-percentage {
      color: var(--card-text);

      font-size: 1rem;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }


      .app-container {
        max-width: 100%;

        gap: 12px;
      }


      .module-card {
        padding: 16px 18px;

        font-size: 1rem;

        border-radius: 16px;
      }


      .quiz-card {
        padding: 18px 15px;

        border-radius: 17px;

        gap: 13px;
      }


      .question-text {
        font-size: 1rem;
      }


      .option-btn {
        padding: 12px;

        font-size: 0.92rem;
      }


      .action-btn {
        padding: 13px;

        font-size: 0.98rem;
      }
    }
  </style>
</head>


<body>

  <div class="app-container">

    <!-- ===================================================
         LOADING
         =================================================== -->

    <div
      id="loader"
      class="loader"
      style="display: none;"
    >
      Loading Quiz Data...
    </div>


    <!-- ===================================================
         MODULE MENU
         =================================================== -->

    <div
      id="menu-screen"
      class="module-menu"
    >

      <!-- MODULE 1 -->

      <div
        class="module-card"
        onclick="startModule(1)"
      >
        Module 1 - General Information
      </div>


      <!-- MODULE 2 -->

      <div
        class="module-card"
        onclick="startModule(2)"
      >
        Module 2 - Personnel Issued and Concern
      </div>


      <!-- MODULE 3 -->

      <div
        class="module-card"
        onclick="startModule(3)"
      >
        Module 3 - Laws
      </div>


      <!-- MODULE 4 -->

      <div
        class="module-card disabled"
      >
        Module 4 - Corrections Administration and Operation
      </div>


      <!-- MODULE 5 -->

      <div
        class="module-card disabled"
      >
        Module 5 - Overview of Reformation Program
      </div>

    </div>


    <!-- ===================================================
         QUIZ ENGINE
         =================================================== -->

    <div
      id="quiz-card"
      class="quiz-card"
    >

      <!-- HEADER -->

      <div class="quiz-header">

        <button
          class="back-btn"
          onclick="showMenu()"
        >
          ← Modules
        </button>


        <span id="question-tracker">
          Question 1/30
        </span>

      </div>


      <!-- PROGRESS -->

      <div class="progress-bar-wrap">

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>

      </div>


      <!-- QUESTION -->

      <div
        id="question-text"
        class="question-text"
      ></div>


      <!-- INTERACTIVE AREA -->

      <div
        id="interactive-area"
      ></div>


      <!-- FEEDBACK -->

      <div
        id="feedback-box"
        class="feedback-box"
      ></div>


      <!-- NEXT -->

      <button
        id="next-btn"
        class="action-btn next-btn"
        onclick="nextQuestion()"
      >
        Next Question →
      </button>


      <!-- RESULTS -->

      <div
        id="results-box"
        class="results-box"
      >

        <h2>
          Module Completed!
        </h2>


        <div
          id="results-score"
          class="results-score"
        >
          0 / 0
        </div>


        <p
          id="results-percentage"
          class="results-percentage"
        ></p>


        <button
          class="action-btn"
          onclick="showMenu()"
        >
          Back to Main Menu
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       GOOGLE APPS SCRIPT WEB APP URL

       IMPORTANT:
       Replace this with your actual /exec URL.

       Example:

       https://script.google.com/macros/s/XXXXXXXX/exec
       ===================================================== */

    const GAS_WEB_APP_URL =
      'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';


    /* =====================================================
       QUIZ VARIABLES
       ===================================================== */

    let rawQuizData = [];

    let currentQuestionIndex = 0;

    let score = 0;

    let answered = false;

    let currentModule = 0;


    /* =====================================================
       START MODULE
       ===================================================== */

    async function startModule(moduleNum) {

      /*
       Only Modules 1, 2, and 3 are currently available.
      */

      if (![1, 2, 3].includes(moduleNum)) {
        return;
      }


      currentModule = moduleNum;


      /*
       Show loader
      */

      document.getElementById(
        'loader'
      ).style.display = 'block';


      document.getElementById(
        'menu-screen'
      ).style.display = 'none';


      try {

        /*
         Build API URL
        */

        const url =
          GAS_WEB_APP_URL +
          '?module=' +
          encodeURIComponent(moduleNum);


        console.log(
          'Loading module:',
          moduleNum
        );

        console.log(
          'API URL:',
          url
        );


        /*
         Request data from Apps Script
        */

        const response =
          await fetch(url);


        /*
         Check HTTP response
        */

        if (!response.ok) {

          throw new Error(
            'Server returned HTTP ' +
            response.status
          );

        }


        /*
         Convert response to JSON
        */

        const result =
          await response.json();


        console.log(
          'API Response:',
          result
        );


        /*
         Check API response
        */

        if (!result.success) {

          throw new Error(
            result.error ||
            'Unable to load quiz data.'
          );

        }


        /*
         Make sure data is an array
        */

        if (!Array.isArray(result.data)) {

          throw new Error(
            'Quiz data is not in the expected format.'
          );

        }


        /*
         Save quiz data
        */

        rawQuizData =
          result.data;


        /*
         Hide loader
        */

        document.getElementById(
          'loader'
        ).style.display = 'none';


        /*
         Start quiz
        */

        initQuiz();

      }


      catch (error) {

        console.error(
          'Quiz loading error:',
          error
        );


        /*
         Hide loader
        */

        document.getElementById(
          'loader'
        ).style.display = 'none';


        /*
         Return to menu
        */

        document.getElementById(
          'menu-screen'
        ).style.display = 'flex';


        /*
         Show error
        */

        alert(
          'Unable to load this module.\n\n' +
          'Please check your Google Apps Script deployment and Web App URL.\n\n' +
          'Error: ' +
          error.message
        );

      }

    }


    /* =====================================================
       INITIALIZE QUIZ
       ===================================================== */

    function initQuiz() {

      currentQuestionIndex = 0;

      score = 0;

      answered = false;


      document.getElementById(
        'menu-screen'
      ).style.display = 'none';


      document.getElementById(
        'quiz-card'
      ).style.display = 'flex';


      document.getElementById(
        'results-box'
      ).style.display = 'none';


      loadQuestion();

    }


    /* =====================================================
       LOAD QUESTION
       ===================================================== */

    function loadQuestion() {

      answered = false;


      const q =
        rawQuizData[
          currentQuestionIndex
        ];


      /*
       Safety check
      */

      if (!q) {

        showResults();

        return;

      }


      /*
       Question tracker
      */

      document.getElementById(
        'question-tracker'
      ).innerText =
        `Question ${
          currentQuestionIndex + 1
        }/${rawQuizData.length}`;


      /*
       Progress
      */

      document.getElementById(
        'progress-bar'
      ).style.width =
        `${
          (currentQuestionIndex /
            rawQuizData.length) * 100
        }%`;


      /*
       Question text
      */

      document.getElementById(
        'question-text'
      ).innerText =
        q.question;


      /*
       Reset feedback
      */

      const feedbackBox =
        document.getElementById(
          'feedback-box'
        );


      feedbackBox.style.display =
        'none';


      feedbackBox.className =
        'feedback-box';


      /*
       Hide next button
      */

      document.getElementById(
        'next-btn'
      ).style.display =
        'none';


      /*
       Reset interactive area
      */

      const area =
        document.getElementById(
          'interactive-area'
        );


      area.style.display =
        'block';


      area.innerHTML =
        '';


      /* ===================================================
         MULTIPLE CHOICE
         =================================================== */

      if (q.type === 'mcq') {

        const optionsList =
          document.createElement(
            'div'
          );


        optionsList.className =
          'options-list';


        q.options.forEach(
          opt => {

            const btn =
              document.createElement(
                'button'
              );


            btn.className =
              'option-btn';


            btn.innerText =
              opt;


            /*
             The first character is
             the answer letter.
             */

            const letter =
              opt.charAt(0);


            btn.onclick =
              () => {

                checkMCQAnswer(
                  letter,
                  q.correctAnswer,
                  q.explanation,
                  btn
                );

              };


            optionsList.appendChild(
              btn
            );

          }
        );


        area.appendChild(
          optionsList
        );

      }


      /* ===================================================
         SHORT ANSWER
         =================================================== */

      else if (
        q.type === 'short'
      ) {

        const group =
          document.createElement(
            'div'
          );


        group.className =
          'short-input-group';


        group.innerHTML = `

          <input
            type="text"
            id="short-answer-input"
            class="short-input"
            placeholder="Type answer here..."
            autocomplete="off"
          >

          <button
            class="action-btn"
            onclick="checkShortAnswer()"
          >
            Submit Answer
          </button>

        `;


        area.appendChild(
          group
        );

      }

    }


    /* =====================================================
       CHECK MCQ
       ===================================================== */

    function checkMCQAnswer(
      selectedLetter,
      correctLetter,
      explanation,
      clickedBtn
    ) {

      /*
       Prevent multiple answers.
      */

      if (answered) {
        return;
      }


      answered = true;


      const isCorrect =
        selectedLetter ===
        correctLetter;


      /*
       Get all answer buttons.
      */

      const allBtns =
        document.querySelectorAll(
          '.option-btn'
        );


      /*
       Disable all buttons
       and highlight correct answer.
      */

      allBtns.forEach(
        btn => {

          btn.disabled = true;


          if (
            btn.innerText.startsWith(
              correctLetter
            )
          ) {

            btn.classList.add(
              'correct'
            );

          }

        }
      );


      /*
       Mark incorrect selection.
      */

      if (!isCorrect) {

        clickedBtn.classList.add(
          'incorrect'
        );

      }


      /*
       Increase score.
      */

      else {

        score++;

      }


      /*
       Show feedback.
      */

      showFeedback(
        isCorrect,
        explanation
      );

    }


    /* =====================================================
       CHECK SHORT ANSWER
       ===================================================== */

    function checkShortAnswer() {

      if (answered) {
        return;
      }


      const q =
        rawQuizData[
          currentQuestionIndex
        ];


      const input =
        document.getElementById(
          'short-answer-input'
        );


      const val =
        input.value
          .trim()
          .toLowerCase();


      /*
       Don't submit empty answer.
      */

      if (!val) {
        return;
      }


      answered = true;


      input.disabled = true;


      /*
       Compare against acceptable answers.
      */

      const isCorrect =
        q.acceptableAnswers.some(
          ans =>
            ans
              .trim()
              .toLowerCase() === val
        );


      if (isCorrect) {
        score++;
      }


      showFeedback(
        isCorrect,
        q.explanation
      );

    }


    /* =====================================================
       SHOW FEEDBACK
       ===================================================== */

    function showFeedback(
      isCorrect,
      explanation
    ) {

      const feedbackBox =
        document.getElementById(
          'feedback-box'
        );


      feedbackBox.classList.add(
        isCorrect
          ? 'correct'
          : 'incorrect'
      );


      feedbackBox.innerHTML = `

        <strong>
          ${
            isCorrect
              ? '✓ Correct!'
              : '✗ Incorrect'
          }
        </strong>

        <br>

        ${explanation}

      `;


      feedbackBox.style.display =
        'block';


      /*
       Show next button.
      */

      document.getElementById(
        'next-btn'
      ).style.display =
        'block';

    }


    /* =====================================================
       NEXT QUESTION
       ===================================================== */

    function nextQuestion() {

      currentQuestionIndex++;


      if (
        currentQuestionIndex <
        rawQuizData.length
      ) {

        loadQuestion();

      }

      else {

        showResults();

      }

    }


    /* =====================================================
       SHOW RESULTS
       ===================================================== */

    function showResults() {

      /*
       Complete progress bar.
      */

      document.getElementById(
        'progress-bar'
      ).style.width =
        '100%';


      /*
       Change tracker.
      */

      document.getElementById(
        'question-tracker'
      ).innerText =
        'Completed';


      /*
       Clear question.
      */

      document.getElementById(
        'question-text'
      ).innerText =
        '';


      /*
       Hide interaction.
      */

      document.getElementById(
        'interactive-area'
      ).style.display =
        'none';


      /*
       Hide feedback.
      */

      document.getElementById(
        'feedback-box'
      ).style.display =
        'none';


      /*
       Hide next button.
      */

      document.getElementById(
        'next-btn'
      ).style.display =
        'none';


      /*
       Calculate percentage.
      */

      const percentage =
        Math.round(
          (score /
            rawQuizData.length) *
          100
        );


      /*
       Display score.
      */

      document.getElementById(
        'results-score'
      ).innerText =
        `${score} / ${rawQuizData.length}`;


      document.getElementById(
        'results-percentage'
      ).innerText =
        `Overall Score: ${percentage}%`;


      /*
       Show results.
      */

      document.getElementById(
        'results-box'
      ).style.display =
        'flex';

    }


    /* =====================================================
       BACK TO MODULE MENU
       ===================================================== */

    function showMenu() {

      /*
       Hide quiz.
      */

      document.getElementById(
        'quiz-card'
      ).style.display =
        'none';


      /*
       Show menu.
      */

      document.getElementById(
        'menu-screen'
      ).style.display =
        'flex';


      /*
       Reset quiz state.
      */

      rawQuizData = [];

      currentQuestionIndex = 0;

      score = 0;

      answered = false;

      currentModule = 0;

    }

  </script>

</body>
</html>
